# Becajo — LAMP en Docker + Oracle
#
# Levanta Apache + PHP sirviendo el proyecto. Es el equivalente funcional
# de instalar WAMP: mismo Apache, mismo PHP, mismo resultado en el navegador.
# La diferencia es que corre sobre Linux (LAMP) y queda descrito en un
# archivo que cualquier compañero del equipo puede reproducir igual con
# "docker compose up", sin instalar nada más en su máquina.
#
# El servicio "oracle" agrega la base de datos del proyecto integrador.
# Nadie tiene que instalar Oracle en su máquina: el contenedor la trae.
#
# MIGRACIÓN A POSTGRESQL (2026-09) — CONVIVEN LOS DOS MOTORES
# -----------------------------------------------------------
# El Dockerfile ahora instala pdo_pgsql/pgsql ADEMÁS de oci8 (ver su
# cabecera), así que la misma imagen sirve para los dos caminos:
#
#   - "web" y "oracle" siguen siendo el camino de siempre: la app entera
#     (auditorías, catálogo, Lembas, y lo que persiste el monitor) corre
#     contra Oracle, exactamente como antes de esta nota.
#
#   - "monitor" (bin/monitor.php) NO CAMBIÓ: sigue leyendo la instancia
#     vigilada por oci8 (vistas v$*, exclusivas de Oracle) y escribiendo el
#     resultado con la cuenta "becajo" de este mismo Oracle — es
#     precisamente la función que se presenta mañana, y sigue intacta.
#
#   - "postgres" es NUEVO y OPCIONAL: una base Postgres para probar la
#     migración de la parte 1 (auditorías/catálogo/Lembas) rumbo a Azure
#     Database for PostgreSQL. Ni "web" ni "monitor" la usan por defecto —
#     "docker compose up" de siempre levanta exactamente lo mismo que
#     siempre. Para probar el camino Postgres, se cambia BD_MOTOR/BD_CADENA
#     del servicio "web" a los valores comentados más abajo, o se apunta
#     config/base_datos.php a Postgres localmente (BD_MOTOR=postgres,
#     BD_CADENA="host=postgres port=5432 dbname=rivendel sslmode=disable").
#     El código PHP para ese camino (app/Core/BaseDatosPostgres.php,
#     RepositorioAuditoriasPostgres.php, RepositorioInstrumentoPostgres.php,
#     RepositorioMonitorPostgres.php, Scripts/postgres/*.sql) ya está escrito
#     y probado; lo único pendiente es decidir cuándo cambiar el valor por
#     defecto de "web".
#
#   - bin/monitor.php seguirá escribiendo contra Oracle mientras siga usando
#     App\Core\BaseDatos directamente (no es "motor"-aware, a diferencia de
#     public/index.php): eso es trabajo aparte si algún día se quiere que el
#     monitor persista en Postgres en vez de Oracle.

services:
  web:
    build: .
    platform: linux/amd64
    container_name: becajo-web
    ports:
      # http://localhost:8080 en la Mac -> puerto 80 dentro del contenedor
      - "8080:80"
    volumes:
      # Monta el proyecto dentro del contenedor. Cualquier cambio que hagas
      # en tu editor se refleja al instante, sin reconstruir la imagen.
      - .:/var/www/html
    environment:
      APP_ENV: desarrollo
      # Datos de conexión que lee config/base_datos.php. Se declaran aquí
      # (y no dentro del PHP) para que las credenciales no vivan en el
      # código; en producción las inyecta el servicio de hosting.
      #
      # "oracle" es el nombre del servicio de abajo: dentro de la red de
      # Docker funciona como nombre de host, no hace falta ninguna IP.
      BD_MOTOR: oracle
      BD_CADENA: oracle:1521/FREEPDB1
      BD_USUARIO: becajo
      BD_CLAVE: becajo
      # Para probar el camino Postgres en vez del de arriba (ver la nota de
      # cabecera): comentar las 4 líneas de BD_* de Oracle y descomentar
      # estas, y cambiar el depends_on de abajo a "postgres".
      #   BD_MOTOR: postgres
      #   BD_CADENA: "host=postgres port=5432 dbname=rivendel sslmode=disable"
      #   BD_USUARIO: becajo
      #   BD_CLAVE: becajo
      #
      # Lembas. Los valores salen del archivo .env de la raíz, que compose lee
      # solo al levantar (ver .env.ejemplo), y se pasan UNO A UNO: el contenedor
      # recibe estas variables y no el archivo entero. Sin .env todo queda con
      # su valor por defecto y la clave vacía, o sea, Lembas apagado; nadie del
      # equipo necesita una clave para levantar el proyecto.
      #
      # Solo "web": el agente de monitoreo no habla con ningún modelo, y una
      # credencial que un servicio no usa es una credencial que puede filtrar.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEMBAS_MODELO: ${LEMBAS_MODELO:-claude-opus-5}
      LEMBAS_ESFUERZO: ${LEMBAS_ESFUERZO:-low}
      LEMBAS_MAX_TOKENS: ${LEMBAS_MAX_TOKENS:-8000}
      LEMBAS_LIMITE_DIARIO_USUARIO: ${LEMBAS_LIMITE_DIARIO_USUARIO:-20}
      LEMBAS_LIMITE_DIARIO_TOTAL: ${LEMBAS_LIMITE_DIARIO_TOTAL:-150}
    depends_on:
      oracle:
        # No basta con que el contenedor exista: Oracle tarda un par de
        # minutos en abrir la base la primera vez. "service_healthy" hace
        # que web espere hasta que el healthcheck de abajo pase.
        condition: service_healthy

  monitor:
    # Agente de monitoreo (parte 2, §4.1 del plan): recolecta cada N minutos,
    # fuera de la petición web, para que una instancia colgada no deje una
    # página esperando y para que la serie de tiempo tenga regularidad real.
    # Misma imagen que "web" -ya trae oci8-, pero docker/monitor.sh
    # reemplaza el CMD de abajo: no arranca Apache, corre bin/monitor.php en
    # un bucle.
    build: .
    platform: linux/amd64
    container_name: becajo-monitor
    entrypoint: ["/usr/local/bin/monitor.sh"]
    volumes:
      - .:/var/www/html
    environment:
      # Conexión de ESCRITURA (la cuenta becajo, la misma que usa "web"): el
      # esquema del monitor vive en este mismo usuario (§7 del plan). No es
      # la cuenta de solo lectura del agente -esa es C##RIVENDEL_MONITOR,
      # abajo- y nunca debe confundirse con ella.
      BD_CADENA: oracle:1521/FREEPDB1
      BD_USUARIO: becajo
      BD_CLAVE: becajo
      # Credenciales de LECTURA contra la instancia vigilada
      # (Scripts/00_usuario_monitor.sql). host/puerto/servicio van por
      # instancia en la tabla `instancia`, no aquí (config/monitor.ejemplo.php).
      BD_MONITOR_USUARIO: C##RIVENDEL_MONITOR
      BD_MONITOR_CLAVE: RivendelMonitor2026
      BD_MONITOR_INTERVALO_MINUTOS: "5"
    depends_on:
      oracle:
        condition: service_healthy

  oracle:
    # Oracle Database 23ai Free: gratuita para desarrollo y docencia.
    # La variante "slim" ocupa bastante menos y alcanza de sobra para el
    # tamaño de datos del proyecto.
    image: gvenzl/oracle-free:23-slim
    container_name: becajo-oracle
    ports:
      # Por si se quiere conectar SQL Developer o DBeaver desde el anfitrión:
      # localhost:1522/FREEPDB1.
      #
      # Se publica en el 1522 y no en el 1521 porque quien ya tenga Oracle
      # instalado en su equipo tiene el listener (tnslsnr) ocupando el 1521, y
      # el contenedor no arrancaría. La aplicación no usa este puerto: web se
      # conecta a "oracle:1521" por la red interna de Docker, así que cambiarlo
      # aquí no afecta a nada más.
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: oracle          # clave de SYS / SYSTEM
      APP_USER: becajo                 # usuario de la aplicación
      APP_USER_PASSWORD: becajo
    volumes:
      # Los datos sobreviven a "docker compose down": sin este volumen,
      # cada reinicio obligaría a volver a cargar el esquema.
      - oracle-datos:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      # La primera creación de la base tarda; sin este margen, Docker daría
      # el contenedor por fallido antes de que termine de arrancar.
      start_period: 300s

  postgres:
    # NUEVO, OPCIONAL: para probar la migración a PostgreSQL (rumbo a Azure
    # Database for PostgreSQL) sin tocar el camino Oracle de arriba. "web" y
    # "monitor" no dependen de este servicio por defecto — ver la nota de
    # cabecera para activarlo.
    image: postgres:16-alpine
    container_name: becajo-postgres
    ports:
      # Por si se quiere conectar psql, DBeaver o pgAdmin desde el anfitrión.
      - "5432:5432"
    environment:
      POSTGRES_USER: becajo
      POSTGRES_PASSWORD: becajo
      POSTGRES_DB: rivendel
    volumes:
      # Los datos sobreviven a "docker compose down": sin este volumen, cada
      # reinicio obligaría a volver a cargar el esquema.
      - postgres-datos:/var/lib/postgresql/data
      # La imagen oficial de Postgres ejecuta, en orden alfabético y SOLO la
      # primera vez que el volumen de datos está vacío, todo .sql que
      # encuentre en /docker-entrypoint-initdb.d/. De ahí los prefijos
      # numéricos de Scripts/postgres/*.sql: en Postgres no hace falta un
      # `docker exec ... < script.sql` manual como en Oracle, el contenedor
      # se siembra solo al primer arranque.
      - ./Scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U becajo -d rivendel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles:
      # Con "profiles", este servicio NO se levanta con un "docker compose
      # up" normal — solo con "docker compose --profile postgres up". Así la
      # demo de mañana (oracle + web + monitor) no arrastra un contenedor
      # extra que no necesita.
      - postgres

volumes:
  oracle-datos:
  postgres-datos:
