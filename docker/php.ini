; Becajo — ajustes de PHP para la imagen de Apache.
;
; Existe por UNA razón: el adjunto de la evidencia. PHP viene de fábrica con
; upload_max_filesize = 2M y post_max_size = 8M, y la aplicación acepta
; archivos de hasta 5 MB (ck_evidarch_tamano en el esquema). Sin este archivo
; el tope real serían 2 MB y el rechazo llegaría desde PHP, no desde la
; validación — es decir, sin un mensaje en el campo.
;
; post_max_size va POR ENCIMA de upload_max_filesize a propósito: el cuerpo de
; la petición lleva además el token, el hallazgo, la recomendación y el resto
; del formulario del control. Si los dos fueran iguales, un archivo justo en el
; límite tumbaría el envío entero.
;
; Rebasar post_max_size vacía $_POST, no solo $_FILES. Por eso
; Peticion::excedioLimitePost() lo detecta y AuditoriaController lo trata antes
; de comprobar el token: sin esa comprobación el auditor recibiría un error de
; sesión caducada por haber adjuntado un archivo grande.
upload_max_filesize = 6M
post_max_size = 10M

; Y esto es lo que hace que ese aviso se pueda dar.
;
; Cuando el cuerpo se pasa de post_max_size, PHP emite un E_WARNING ANTES de
; ejecutar public/index.php — antes, por tanto, del ini_set('display_errors')
; que decide si los errores se ven. En desarrollo se ven, así que ese aviso se
; imprime, la respuesta queda comprometida y a partir de ahí ningún header()
; surte efecto: el redirect con el mensaje no sale, la sesión no arranca y el
; auditor recibe una página de warnings de PHP.
;
; Con un búfer de salida, ese aviso se queda en memoria en lugar de irse por el
; cable, las cabeceras siguen sin enviarse y la redirección funciona. No oculta
; nada: el búfer se vuelca igual al terminar. Solo retrasa el envío lo justo
; para que el código pueda decidir el código de estado.
output_buffering = 4096
